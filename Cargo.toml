[workspace]
members = ["sensors-core", "FrameworkSensors"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false
license = "MS-PL"

[workspace.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 33

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[workspace.dependencies]
anyhow = "1.0.104"
paste = "1.0.15"
wdk = "0.5.0"
wdk-build = "0.6.0"
wdk-panic = "0.5.0"
wdk-sys = "0.5.2"
windows-sys = "0.61.2"
